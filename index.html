<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Blend Theory Referral</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b0c;
      color: #f7f7f5;
      font-family: Arial, Helvetica, sans-serif;
    }

    .wrap {
      max-width: 520px;
      margin: auto;
      padding: 34px 18px 50px;
    }

    .brand {
      text-align: center;
      font-weight: 900;
      letter-spacing: .18em;
      font-size: 14px;
      margin-bottom: 32px;
    }

    .card {
      background: #171719;
      border: 1px solid #303034;
      border-radius: 24px;
      padding: 26px 20px;
      box-shadow: 0 18px 50px rgba(0,0,0,.25);
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: .16em;
      color: #aaa;
      font-weight: 700;
    }

    .hero {
      font-size: 38px;
      line-height: 1.02;
      font-weight: 900;
      margin: 10px 0 12px;
    }

    p {
      color: #c7c7ca;
      line-height: 1.5;
    }

    .ref {
      padding: 12px 14px;
      border: 1px solid #38383d;
      border-radius: 12px;
      margin: 18px 0;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin: 16px 0 7px;
    }

    input {
      width: 100%;
      padding: 15px 14px;
      border-radius: 12px;
      border: 1px solid #38383d;
      background: #0e0e10;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 16px;
      border: 0;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
    }

    .status {
      text-align: center;
      font-size: 13px;
      min-height: 20px;
      margin-top: 12px;
      color: #cfcfd3;
    }

    .fine {
      font-size: 11px;
      color: #7f7f84;
      margin-top: 15px;
      text-align: center;
    }

    /* Invisible target used for Apps Script submission */
    #submissionFrame {
      display: none;
    }
  </style>
</head>

<body>

<div class="wrap">

  <div class="brand">
    BLEND THEORY
  </div>

  <main class="card">

    <div class="eyebrow">
      CLIENT REFERRAL
    </div>

    <div class="hero">
      You've been put on.
    </div>

    <p>
      A Blend Theory client sent you here.
      Claim the referral and book your cut.
    </p>

    <div class="ref">
      Referral code:
      <strong id="refLabel"></strong>
    </div>

    <form
      id="claimForm"
      method="POST"
      target="submissionFrame"
      action="https://script.google.com/macros/s/AKfycby63YcnW6ci_9KK1pVKahc8fEyvCp0s5tz6OWfky_jzWeHMIxW8kh4TdHXE0xqmQ3GmOQ/exec">

      <input
        type="hidden"
        id="referralCode"
        name="referralCode">

      <label for="name">
        Your name
      </label>

      <input
        id="name"
        name="name"
        autocomplete="name"
        required>

      <label for="phone">
        Phone
      </label>

      <input
        id="phone"
        name="phone"
        autocomplete="tel"
        inputmode="tel">

      <label for="email">
        Email
      </label>

      <input
        id="email"
        name="email"
        autocomplete="email"
        inputmode="email">

      <button
        id="submitBtn"
        type="submit">
        CLAIM & BOOK
      </button>

      <div
        class="status"
        id="status">
      </div>

    </form>

    <iframe
      id="submissionFrame"
      name="submissionFrame">
    </iframe>

    <div class="fine">
      Referral credit is awarded after the referred client
      completes and pays for a qualifying appointment.
    </div>

  </main>
</div>


<script>

  const params =
    new URLSearchParams(window.location.search);

  const REFERRAL_CODE =
    (
      params.get('ref') ||
      params.get('code') ||
      ''
    )
    .trim()
    .toUpperCase();


  const BOOKING_URL =
    'https://blend-theory-103153.square.site/';


  const form =
    document.getElementById('claimForm');

  const button =
    document.getElementById('submitBtn');

  const statusBox =
    document.getElementById('status');

  const refLabel =
    document.getElementById('refLabel');

  const referralInput =
    document.getElementById('referralCode');


  refLabel.textContent =
    REFERRAL_CODE || 'Missing code';

  referralInput.value =
    REFERRAL_CODE;


  if (!REFERRAL_CODE) {

    button.disabled = true;

    statusBox.textContent =
      'This referral link is missing a referral code.';

  }


  form.addEventListener(
    'submit',
    function(event) {

      const name =
        document.getElementById('name')
          .value.trim();

      const phone =
        document.getElementById('phone')
          .value.trim();

      const email =
        document.getElementById('email')
          .value.trim();


      if (!name) {

        event.preventDefault();

        statusBox.textContent =
          'Please enter your name.';

        return;
      }


      if (!phone && !email) {

        event.preventDefault();

        statusBox.textContent =
          'Please enter a phone number or email.';

        return;
      }


      button.disabled = true;

      button.textContent =
        'SAVING REFERRAL...';

      statusBox.textContent =
        'Referral received. Opening booking...';


      /*
       * Allow the hidden form submission enough time
       * to reach Apps Script before leaving for Square.
       */

      setTimeout(function() {

        const booking =
          BOOKING_URL +
          '?utm_source=referral' +
          '&utm_medium=client' +
          '&utm_campaign=refer2free' +
          '&utm_content=' +
          encodeURIComponent(REFERRAL_CODE);

        window.location.href =
          booking;

      }, 1800);

    }
  );

</script>

</body>
</html>
