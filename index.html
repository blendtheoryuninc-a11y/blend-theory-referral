<!doctype html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Blend Theory Referral</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b0b0c;
  color: #f7f7f5;
  font-family:
    Arial,
    Helvetica,
    sans-serif;
}

.wrap {
  max-width: 520px;
  margin: auto;
  padding: 34px 18px 50px;
}

.brand {
  text-align: center;
  font-weight: 900;
  letter-spacing: .18em;
  font-size: 14px;
  margin-bottom: 32px;
}

.card {
  background: #171719;
  border: 1px solid #303034;
  border-radius: 24px;
  padding: 26px 20px;
  box-shadow:
    0 18px 50px rgba(0,0,0,.25);
}

.eyebrow {
  font-size: 12px;
  letter-spacing: .16em;
  color: #aaa;
  font-weight: 700;
}

.hero {
  font-size: 38px;
  line-height: 1.02;
  font-weight: 900;
  margin: 10px 0 12px;
}

p {
  color: #c7c7ca;
  line-height: 1.5;
}

.ref {
  padding: 12px 14px;
  border: 1px solid #38383d;
  border-radius: 12px;
  margin: 18px 0;
}

label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  margin: 16px 0 7px;
}

input {
  width: 100%;
  padding: 15px 14px;
  border-radius: 12px;
  border: 1px solid #38383d;
  background: #0e0e10;
  color: white;
  font-size: 16px;
}

button {
  width: 100%;
  margin-top: 22px;
  padding: 16px;
  border: 0;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 900;
  cursor: pointer;
}

button:disabled {
  opacity: .55;
}

.status {
  text-align: center;
  font-size: 13px;
  min-height: 20px;
  margin-top: 12px;
  color: #cfcfd3;
}

.fine {
  font-size: 11px;
  color: #7f7f84;
  margin-top: 15px;
  text-align: center;
}

</style>

</head>


<body>

<div class="wrap">

<div class="brand">
  BLEND THEORY
</div>


<main class="card">

<div class="eyebrow">
  CLIENT REFERRAL
</div>


<div class="hero">
  You've been put on.
</div>


<p>
  A Blend Theory client sent you here.
  Claim the referral and book your cut.
</p>


<div class="ref">

  Referral code:

  <strong id="refLabel">
  </strong>

</div>


<form id="claimForm">


<label for="name">
  Your name
</label>

<input
  id="name"
  autocomplete="name"
  required>


<label for="phone">
  Phone
</label>

<input
  id="phone"
  autocomplete="tel"
  inputmode="tel">


<label for="email">
  Email
</label>

<input
  id="email"
  autocomplete="email"
  inputmode="email">


<button
  id="submitBtn"
  type="submit">

  CLAIM & BOOK

</button>


<div
  class="status"
  id="status">
</div>


</form>


<div class="fine">

  Referral credit is awarded after the referred client
  completes and pays for a qualifying appointment.

</div>


</main>

</div>


<script>

/*
 * BLEND THEORY REFERRAL FRONT END
 */


/* Apps Script backend */

const WEB_APP_URL =
  'https://script.google.com/macros/s/AKfycby63YcnW6ci_9KK1pVKahc8fEyvCp0s5tz6OWfky_jzWeHMIxW8kh4TdHXE0xqmQ3GmOQ/exec';


/* Square booking */

const BOOKING_URL =
  'https://blend-theory-103153.square.site/';


/* Read referral code from URL */

const params =
  new URLSearchParams(
    window.location.search
  );


const REFERRAL_CODE =
  (
    params.get('ref') ||
    params.get('code') ||
    ''
  )
  .trim()
  .toUpperCase();


/* Page elements */

const form =
  document.getElementById(
    'claimForm'
  );


const button =
  document.getElementById(
    'submitBtn'
  );


const statusBox =
  document.getElementById(
    'status'
  );


const refLabel =
  document.getElementById(
    'refLabel'
  );


/* Display referral code */

refLabel.textContent =
  REFERRAL_CODE ||
  'Missing code';


/* Stop invalid links */

if (!REFERRAL_CODE) {

  button.disabled = true;

  statusBox.textContent =
    'This referral link is missing a referral code.';

}


/* =========================
   FORM SUBMISSION
   ========================= */

form.addEventListener(
  'submit',
  async function(event) {

    event.preventDefault();


    const name =
      document
        .getElementById('name')
        .value
        .trim();


    const phone =
      document
        .getElementById('phone')
        .value
        .trim();


    const email =
      document
        .getElementById('email')
        .value
        .trim();


    /* Validate */

    if (!name) {

      statusBox.textContent =
        'Please enter your name.';

      return;

    }


    if (!phone && !email) {

      statusBox.textContent =
        'Please enter a phone number or email.';

      return;

    }


    button.disabled = true;

    button.textContent =
      'SAVING REFERRAL...';


    statusBox.textContent =
      'Recording your referral...';


    /*
     * Send referral to Apps Script.
     *
     * no-cors prevents the customer's
     * browser from blocking the request
     * because GitHub and Google are
     * different domains.
     */

    try {

      await fetch(
        WEB_APP_URL,
        {

          method: 'POST',

          mode: 'no-cors',

          headers: {

            'Content-Type':
              'text/plain;charset=utf-8'

          },

          body: JSON.stringify({

            referralCode:
              REFERRAL_CODE,

            name:
              name,

            phone:
              phone,

            email:
              email

          })

        }
      );


      /*
       * With no-cors the browser intentionally
       * cannot read Google's response.
       *
       * If the network request was sent,
       * continue to Square.
       */

      statusBox.textContent =
        'Referral claimed! Taking you to booking...';


      button.textContent =
        'OPENING BOOKING...';


      const bookingURL =

        BOOKING_URL +

        '?utm_source=referral' +

        '&utm_medium=client' +

        '&utm_campaign=refer2free' +

        '&utm_content=' +

        encodeURIComponent(
          REFERRAL_CODE
        );


      /*
       * Give the POST request a moment
       * before navigating away.
       */

      setTimeout(
        function() {

          window.location.href =
            bookingURL;

        },
        1500
      );


    } catch (error) {


      button.disabled =
        false;


      button.textContent =
        'CLAIM & BOOK';


      statusBox.textContent =
        'Unable to record referral. Please try again.';


    }

  }
);

</script>

</body>

</html>
